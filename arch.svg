<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 815" width="100%" height="100%">
  <defs>
    <!-- 浅色卡片微柔阴影 -->
    <filter id="card-shadow" x="-2%" y="-2%" width="104%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    
    <!-- 垂直连接箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#64748B"/>
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- 画布背景 -->
  <rect width="920" height="815" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- 顶部主标题与系统概览 -->
  <g class="font-sans">
    <circle cx="58" cy="40" r="14" fill="#0EA5E9" fill-opacity="0.12"/>
    <path d="M 52 40 L 56 44 L 64 36" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="38" font-size="18" font-weight="700" fill="#0F172A">系统架构分层设计（Architecture Overview）</text>
    <text x="82" y="55" font-size="12" fill="#64748B">Streamlit MPA 架构 · 论文智能审阅与模拟答辩评测平台</text>
  </g>

  <!-- ==================== 1. 表现层 (Presentation Layer) ==================== -->
  <g class="font-sans">
    <!-- 外层卡片容器 -->
    <rect x="40" y="75" width="840" height="135" rx="12" fill="#F8FAFF" stroke="#C7D2FE" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- 层级头部标识 -->
    <rect x="56" y="88" width="24" height="24" rx="6" fill="#4F46E5"/>
    <text x="68" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
    <text x="90" y="105" font-size="15" font-weight="700" fill="#1E1B4B">表现层（Presentation Layer）</text>
    
    <!-- 架构模式标签 -->
    <rect x="260" y="90" width="395" height="20" rx="4" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="268" y="104" class="font-mono" font-size="10.5" fill="#4338CA">app.py（单页多 Tab 模式） ／ pages/（多页应用模式，Streamlit MPA）</text>

    <!-- 子模块卡片 ① Home -->
    <rect x="56" y="124" width="256" height="70" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="70" y="148" font-size="13" font-weight="700" fill="#312E81">① Home</text>
    <text x="70" y="172" font-size="12" fill="#475569">用户画像录入与系统引导</text>

    <!-- 子模块卡片 ② Document Review -->
    <rect x="332" y="124" width="256" height="70" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="346" y="148" font-size="13" font-weight="700" fill="#312E81">② Document Review</text>
    <text x="346" y="172" font-size="12" fill="#475569">论文深度审阅与结构化分析</text>

    <!-- 子模块卡片 ③ Thesis Defense -->
    <rect x="608" y="124" width="256" height="70" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="622" y="148" font-size="13" font-weight="700" fill="#312E81">③ Thesis Defense</text>
    <text x="622" y="172" font-size="12" fill="#475569">模拟答辩交互与综合报告生成</text>
  </g>

  <!-- 连接线 1 -> 2 -->
  <g class="font-sans">
    <line x1="460" y1="210" x2="460" y2="240" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="415" y="218" width="90" height="16" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="460" y="230" text-anchor="middle" font-size="9.5" fill="#64748B">UI 触发业务函数</text>
  </g>

  <!-- ==================== 2. 业务逻辑层 (Business Logic Layer) ==================== -->
  <g class="font-sans">
    <!-- 外层卡片容器 -->
    <rect x="40" y="240" width="840" height="205" rx="12" fill="#F0FDF4" stroke="#99F6E4" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- 层级头部标识 -->
    <rect x="56" y="253" width="24" height="24" rx="6" fill="#0D9488"/>
    <text x="68" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
    <text x="90" y="270" font-size="15" font-weight="700" fill="#134E4A">业务逻辑层（utils.py）</text>

    <rect x="250" y="255" width="175" height="20" rx="4" fill="#CCFBF1" stroke="#99F6E4"/>
    <text x="258" y="269" class="font-mono" font-size="10.5" fill="#115E59">核心能力服务与容错调度引擎</text>

    <!-- 行 1：文件解析 + Prompt 构建 -->
    <rect x="56" y="290" width="388" height="66" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="70" y="312" font-size="12.5" font-weight="700" fill="#0F766E">· 文件解析：extract_text_from_upload</text>
    <text x="70" y="335" font-size="11.5" fill="#475569">支持多格式解析提取：PDF / DOCX / TXT</text>

    <rect x="460" y="290" width="404" height="66" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="474" y="312" font-size="12.5" font-weight="700" fill="#0F766E">· Prompt 构建：build_* 模板管道</text>
    <text x="474" y="335" class="font-mono" font-size="10.5" fill="#475569">build_review_prompt / build_defense_question / build_final_defense_report</text>

    <!-- 行 2：结果解析 + 本地兜底 -->
    <rect x="56" y="364" width="388" height="66" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="70" y="386" font-size="12.5" font-weight="700" fill="#0F766E">· 结果解析：_parse_ai_review_sections</text>
    <text x="70" y="409" font-size="11.5" fill="#475569">双轨解析策略：JSON 格式优先解析 + Markdown 智能兜底</text>

    <rect x="460" y="364" width="404" height="66" rx="8" fill="#FFFFFF" stroke="#CCFBF1"/>
    <text x="474" y="386" font-size="12.5" font-weight="700" fill="#0F766E">· 本地兜底：local_* 规则降级</text>
    <text x="474" y="409" class="font-mono" font-size="10.5" fill="#475569">local_review_fallback / local_defense_question / local_defense_report</text>
  </g>

  <!-- 连接线 2 -> 3 -->
  <g class="font-sans">
    <line x1="460" y1="445" x2="460" y2="475" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="415" y="453" width="90" height="16" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="460" y="465" text-anchor="middle" font-size="9.5" fill="#64748B">调用模型 / 失败降级</text>
  </g>

  <!-- ==================== 3. AI 服务层 (AI Service Layer) ==================== -->
  <g class="font-sans">
    <!-- 外层卡片容器 -->
    <rect x="40" y="475" width="840" height="145" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- 层级头部标识 -->
    <rect x="56" y="488" width="24" height="24" rx="6" fill="#7C3AED"/>
    <text x="68" y="505" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
    <text x="90" y="505" font-size="15" font-weight="700" fill="#3B0764">AI 服务层（generate_ai_text）</text>

    <rect x="300" y="490" width="455" height="20" rx="4" fill="#EDE9FE" stroke="#DDD6FE"/>
    <text x="308" y="504" class="font-mono" font-size="10.5" fill="#5B21B6">统一封装 NVIDIA NIM（integrate.api.nvidia.com）Chat Completions 接口</text>

    <!-- 卡片 1：配置与鉴权 -->
    <rect x="56" y="525" width="388" height="80" rx="8" fill="#FFFFFF" stroke="#EDE9FE"/>
    <text x="70" y="549" font-size="12.5" font-weight="700" fill="#6D28D9">· 配置读取与鉴权管理</text>
    <text x="70" y="571" font-size="11.5" fill="#475569">Key / 超时时间 / 调试开关动态载入</text>
    <text x="70" y="590" class="font-mono" font-size="10.5" fill="#64748B">优先从 st.secrets 读取，兼容系统环境变量</text>

    <!-- 卡片 2：容错机制 -->
    <rect x="460" y="525" width="404" height="80" rx="8" fill="#FFFFFF" stroke="#EDE9FE"/>
    <text x="474" y="549" font-size="12.5" font-weight="700" fill="#6D28D9">· 异常捕获与熔断降级</text>
    <text x="474" y="571" font-size="11.5" fill="#475569">网络超时或请求失败时自动返回空字符串（""）</text>
    <text x="474" y="590" font-size="11" fill="#64748B">即刻触发上层业务逻辑层无缝降级至 local_* 兜底策略</text>
  </g>

  <!-- 连接线 3 -> 4 -->
  <g class="font-sans">
    <line x1="460" y1="620" x2="460" y2="650" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="415" y="628" width="90" height="16" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="460" y="640" text-anchor="middle" font-size="9.5" fill="#64748B">跨页面会话与持久化</text>
  </g>

  <!-- ==================== 4. 状态持久层 (State Persistence Layer) ==================== -->
  <g class="font-sans">
    <!-- 外层卡片容器 -->
    <rect x="40" y="650" width="840" height="140" rx="12" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5" filter="url(#card-shadow)"/>

    <!-- 层级头部标识 -->
    <rect x="56" y="663" width="24" height="24" rx="6" fill="#D97706"/>
    <text x="68" y="680" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
    <text x="90" y="680" font-size="15" font-weight="700" fill="#78350F">状态持久层（.streamlit/shared_state.json）</text>

    <rect x="380" y="665" width="270" height="20" rx="4" fill="#FEF3C7" stroke="#FDE68A"/>
    <text x="388" y="679" class="font-mono" font-size="10.5" fill="#92400E">initialize_state / persist_shared_state</text>

    <!-- 卡片 1：双向同步 -->
    <rect x="56" y="700" width="388" height="75" rx="8" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="70" y="724" font-size="12.5" font-weight="700" fill="#B45309">· 内存与文件双向同步机制</text>
    <text x="70" y="746" class="font-mono" font-size="11" fill="#475569">session_state &lt;---&gt; shared_state.json</text>
    <text x="70" y="763" font-size="11" fill="#64748B">页面刷新或会话重置时保障核心数据即时持久化</text>

    <!-- 卡片 2：跨页面共享 -->
    <rect x="460" y="700" width="404" height="75" rx="8" fill="#FFFFFF" stroke="#FEF3C7"/>
    <text x="474" y="724" font-size="12.5" font-weight="700" fill="#B45309">· 跨模块数据无缝流转</text>
    <text x="474" y="746" font-size="11.5" fill="#475569">在 Home（画像）、Review（审阅）、Defense（答辩）间共享</text>
    <text x="474" y="763" font-size="11" fill="#64748B">突破 Streamlit 多页面环境下的 Session 隔离壁垒</text>
  </g>
</svg>
